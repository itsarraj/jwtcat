[package]
name = "jwtcat"
version = "0.1.0"
edition = "2021"
description = "Decode and verify a JWT locally — never paste a real token into jwt.io again"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/jwtcat"
readme = "README.md"
keywords = ["jwt", "jsonwebtoken", "auth", "decode", "security"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "jwtcat"
path = "src/lib.rs"

[[bin]]
name = "jwtcat"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
